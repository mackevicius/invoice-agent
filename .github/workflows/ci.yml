name: Checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # A cancelled run on main could stop a deploy halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Start Postgres with pgvector
        run: docker compose up -d --wait db
      - name: Install Python dependencies
        working-directory: api
        run: uv sync --locked --python 3.12
      - name: Check and test the API
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql://invoice:invoice@127.0.0.1:55432/invoice
        run: ./scripts/check.sh
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: invoice-evaluations
          path: api/evals/results/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check and build the web app
        working-directory: web
        run: |
          npm run check
          npm run build
      - name: Start the API and production web app
        env:
          DATABASE_URL: postgresql://invoice:invoice@127.0.0.1:55432/invoice
          COOKIE_SECURE: 'false'
          INVOICE_MODEL_PROVIDER: fake
          INVOICE_FAKE_RESPONSE: ${{ github.workspace }}/api/src/invoice_agent/clients/fixtures/readable.json
        run: |
          uv run --directory api --locked uvicorn invoice_agent.app:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/invoice-api.log 2>&1 &
          npm --prefix web run start -- --hostname 127.0.0.1 > /tmp/invoice-web.log 2>&1 &
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Wait for the API and web app
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/
      - name: Test the Split view on desktop and mobile
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm test
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failures
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs db
          cat /tmp/invoice-api.log /tmp/invoice-web.log 2>/dev/null || true

  deploy:
    needs: checks
    # Skipped until scripts/setup-aws-deploy.sh has set the deploy variables.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      STACK_NAME: invoice-agent
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Build the Lambda image
        run: sam build --template-file infra/template.yaml
      - name: Deploy the API, worker, queue and Invoice files bucket
        env:
          ALERT_EMAIL: ${{ vars.AWS_ALERT_EMAIL }}
          IMAGE_REPOSITORY: ${{ vars.AWS_IMAGE_REPOSITORY }}
          MODEL_PROVIDER: ${{ vars.INVOICE_MODEL_PROVIDER || 'openai' }}
        run: >-
          sam deploy --stack-name "$STACK_NAME"
          --image-repository "$IMAGE_REPOSITORY"
          --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND
          --no-confirm-changeset --no-fail-on-empty-changeset
          --parameter-overrides
          "AlertEmail=$ALERT_EMAIL" "ModelProvider=$MODEL_PROVIDER"
      - name: Migrate the database
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          aws lambda invoke --function-name "$(output MigrationFunctionName)" \
            /tmp/migration.json > /tmp/invoke.json
          if jq -e 'has("FunctionError")' /tmp/invoke.json > /dev/null; then
            cat /tmp/migration.json
            exit 1
          fi
          api_url=$(output ApiUrl)
          echo "API_URL=${api_url%/}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Deploy the web app to Vercel
        working-directory: web
        run: |
          npx --yes vercel@65 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Upload an Invoice on the live URL and wait for it to finish
        run: scripts/smoke-check.sh "${{ vars.WEB_URL }}"

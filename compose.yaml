services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: invoice
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoice -d invoice']
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://invoice:invoice@db:5432/invoice
      TEST_DATABASE_URL: postgresql://invoice:invoice@db:5432/invoice
      COOKIE_SECURE: 'false'
      INVOICE_MODEL_PROVIDER: ${INVOICE_MODEL_PROVIDER:-openai}
      INVOICE_MODEL: ${INVOICE_MODEL:-}
      INVOICE_AI_DAILY_VISITOR_LIMIT: ${INVOICE_AI_DAILY_VISITOR_LIMIT:-5}
      INVOICE_AI_DAILY_GLOBAL_LIMIT: ${INVOICE_AI_DAILY_GLOBAL_LIMIT:-100}
      INVOICE_FAKE_RESPONSE: ${INVOICE_FAKE_RESPONSE:-/app/src/invoice_agent/clients/fixtures/readable.json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    volumes:
      - ./api:/app
      - api_venv:/app/.venv
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules
      - web_next:/app/.next
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_venv:
  web_modules:
  web_next:

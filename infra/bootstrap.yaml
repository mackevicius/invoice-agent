AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time setup for Invoice Agent deploys: the image repository and the role
  GitHub Actions assumes through OIDC to deploy infra/template.yaml.

Parameters:
  GitHubRepository:
    Type: String
    Description: owner/repo allowed to deploy from its main branch.
  StackName:
    Type: String
    Default: invoice-agent
    Description: Name of the application stack the role may manage.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: false
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep recent deploy images only",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      ManagedPolicyArns:
        # Everything except IAM; the inline policy adds IAM for this stack's roles only.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: ManageApplicationRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*
              - Effect: Deny
                Action: ssm:GetParameter*
                Resource: !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/invoice-agent*

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ImageRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
